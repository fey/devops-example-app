[tools]
betterleaks = "latest"
hk = "2"
jactionlint = "latest"
lychee = "latest"
node = "26"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
osv-scanner = "latest"
pkl = "latest"
pnpm = "12"
rumdl = "latest"
shellcheck = "latest"
typos = "latest"

# Задачи проекта живут здесь, Makefile только проксирует make <задача> в mise run.
# Точную версию pnpm задаёт packageManager в package.json, здесь только мажор.
[tasks.setup]
description = "Поставить зависимости и git-хуки"
run = ["pnpm install", "hk install"]

[tasks.test]
description = "Тесты приложения; тест стилей читает собранный dist"
run = ["pnpm run build", "pnpm test"]

[tasks.start]
description = "Собрать интерфейс и запустить приложение локально"
run = ["pnpm run build", "pnpm start"]

[tasks.check]
description = "Все проверки, тот же набор, что гоняет CI"
run = "hk check --all"

[tasks.fix]
description = "Применить автоисправления"
run = "hk fix --all"
